[package]
name = "hyper-gantt-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }
hyper-gantt-core = { path = "../core" }
bevy = { version = "0.12", features = ["webgl2"] }

[patch.crates-io]
getrandom = { version = "0.2", features = ["js"] }
