[workspace]
members = ["core", "web", "native"]

[package]
name = "hyper-gantt"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.12", features = ["dynamic_linking"] }
chrono = "0.4"
rand = "0.8"
wasm-bindgen = "0.2.92"
web-sys = { version = "0.3.69", features = ["Window"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
